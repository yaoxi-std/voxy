plugins {
    id 'fabric-loom' version "1.16-SNAPSHOT"
    id 'maven-publish'
}

def isInGHA = rootProject.ext.isInGHA
def isMacOsHost = rootProject.ext.isMacOsHost

version = "${project.mod_version}+${project.minecraft_version}-fabric"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }

    exclusiveContent {
        forRepository {
            ivy {
                name = "github"
                url = "https://github.com/"
                patternLayout {
                    artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]'
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeModuleByRegex("[^\\.]+", "nvidium")
        }
    }
}

// Shared core lives in the repository root; loader glue lives in src/fabric.
sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
            srcDir rootProject.file('src/fabric/java')
        }
        resources {
            srcDir rootProject.file('src/main/resources')
            srcDir rootProject.file('src/fabric/resources')
        }
    }
}

def buildtime = {System.currentTimeSeconds()}

processResources {
    def time = buildtime()
    def hash = rootProject.ext.gitCommitHash()
    def version = project.version

    inputs.properties("version": version, "commit": hash, "buildtime": time)
    filesMatching("fabric.mod.json") {
        expand "version": version, "commit": hash, "buildtime": time
    }
}

def voxyRunProps = rootProject.ext.voxyRunProperties()
def sharedAccessWidener = project.rootProject.file("src/fabric/resources/voxy.accesswidener")

loom {
    accessWidenerPath = sharedAccessWidener

    runs {
        client {
            runDir "../run"

            voxyRunProps.each { key, value ->
                property key, value
            }

            // e.g. ./gradlew :fabric:runClient -PquickplayWorld="New World"
            if (project.hasProperty('quickplayWorld')) {
                programArgs('--quickPlaySingleplayer', project.property('quickplayWorld').toString())
            }
        }
    }
}

def modRuntimeOnlyMsk = {arg->}
if (!isInGHA) {
    modRuntimeOnlyMsk = { arg ->
        dependencies {
            modRuntimeOnly(arg)
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"


    modRuntimeOnlyMsk(fabricApi.module("fabric-api-base", project.fabric_api_version))
    modRuntimeOnlyMsk(fabricApi.module("fabric-rendering-fluids-v1", project.fabric_api_version))
    modRuntimeOnlyMsk(fabricApi.module("fabric-resource-loader-v0", project.fabric_api_version))
    modRuntimeOnlyMsk(fabricApi.module("fabric-command-api-v2", project.fabric_api_version))

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modRuntimeOnlyMsk "maven.modrinth:sodium:mc1.21.1-0.8.12-fabric"
    modCompileOnly "maven.modrinth:sodium:mc1.21.1-0.8.12-fabric"

    modImplementation("maven.modrinth:lithium:mc1.21.1-0.15.0-fabric")

    // Sable (Aero's contraption engine) compile-only compat; its classes are referenced
    // via remap=false mixins so the unremapped jar is fine on both loaders.
    compileOnly("maven.modrinth:sable:${project.sable_neoforge_version}")
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${project.minecraft_version}:${project.sable_companion_version}")

    // Nvidium has no Sodium 0.8 build yet. Keep its API compile-only for the optional mixin,
    // without pulling Sodium 0.6 transitively or adding Nvidium to the dev runtime.
    modCompileOnly("drouarb:nvidium:0.4.1-beta9:1.21-1.21.1@jar") {
        transitive = false
    }

    modCompileOnly("maven.modrinth:modmenu:11.0.3")
    modRuntimeOnlyMsk("maven.modrinth:modmenu:11.0.3")

    modCompileOnly("maven.modrinth:iris:1.8.14-beta.1+1.21.1-fabric")
    modRuntimeOnlyMsk("maven.modrinth:iris:1.8.14-beta.1+1.21.1-fabric")
    // iris needs these for some reason
    modRuntimeOnlyMsk("io.github.douira:glsl-transformer:2.0.1")
    modRuntimeOnlyMsk("org.anarres:jcpp:1.4.14")

    // Sodium Extra 0.6 targets Sodium 0.6 and is intentionally omitted from this dev runtime.

    modCompileOnly("maven.modrinth:chunky:1.4.23-fabric")
    modRuntimeOnlyMsk("maven.modrinth:chunky:1.4.23-fabric")

    modRuntimeOnlyMsk("maven.modrinth:spark:1.10.152-fabric")
    modRuntimeOnlyMsk("maven.modrinth:fabric-permissions-api:0.3.3")

    modCompileOnly("maven.modrinth:vivecraft:1.21.9-1.3.2-fabric")

    modCompileOnly("maven.modrinth:flashback:rNCr1Rbs")
}


def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from(rootProject.file("LICENSE.md")) {
        rename { "${it}_${project.archives_base_name}"}
    }
}

processResources {
    if (isMacOsHost) {
        dependsOn rootProject.tasks.named('compileGl41MetalNative')
        dependsOn rootProject.tasks.named('compileGl41MetalShaders')

        from(rootProject.ext.gl41MetalNativeDir) {
            include 'libvoxy_gl41metal.dylib'
            into 'natives/macos'
        }
        from(rootProject.ext.gl41MetalShaderDir) {
            include 'voxy_gl41metal.metallib'
            into 'natives/macos/gl41metal'
        }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    if (isMacOsHost) {
        dependsOn rootProject.tasks.named('compileGl41MetalNative')
        dependsOn rootProject.tasks.named('compileGl41MetalShaders')
    }
}



tasks.register('makeExcludedRocksDB', Zip) {
    archiveExtension.set("jar")
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory.set temporaryDir

    dependsOn configurations.includeInternal

    def files = configurations.includeInternal.incoming.getArtifacts().getArtifactFiles().filter {
        it.name.startsWith('rocksdb')
    }
    
    from {->zipTree(files.first())}
    archiveFileName.set(providers.provider{files.first().name})

    exclude {
        def file = it.name
        // Keep the Apple-silicon macOS native: this fork's gl41metal backend targets arm64 Macs,
        // and RocksDB's NativeLibraryLoader hard-fails when its platform jnilib is missing.
        if (file.contains("osx-arm64")) {
            return false
        }
        if (file.endsWith(".jnilib")) {
            return true
        }
        if (!file.endsWith(".so")) {
            return false
        }
        return ["osx", "linux32", "musl", "s390x", "riscv64", "ppc64le", "aarch64"].any(file::contains)
    }
}

processIncludeJars {
    outputs.cacheIf {true}

    dependsOn makeExcludedRocksDB
    jars = jars.filter {!it.name.startsWith('rocksdb')}
    jars.from(makeExcludedRocksDB)
}

remapJar {
    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    if (!isInGHA) {
        def hash = rootProject.ext.gitCommitHash();
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash);
        }
    }
}

project.ext.lwjglVersion = "3.3.3"

repositories {
    mavenCentral()
}


dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    include(implementation "org.lwjgl:lwjgl-lmdb")
    include(implementation "org.lwjgl:lwjgl-zstd")
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-macos-arm64"
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-windows")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-linux")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-macos")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-macos")
    include(runtimeOnly "org.lwjgl:lwjgl-lmdb:$lwjglVersion:natives-macos-arm64")
    include(runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-macos-arm64")

    include(implementation 'redis.clients:jedis:5.1.0')
    include(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    include(implementation 'org.apache.commons:commons-pool2:2.12.0')
    include(implementation 'org.lz4:lz4-java:1.8.0')
    include(implementation('org.tukaani:xz:1.10'))

    if (true) {
        if (!isInGHA) {
            minecraftRuntimeLibraries('org.xerial:sqlite-jdbc:3.49.1.0')
        }
    } else {
        include(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))
    }
}

if (!isInGHA) {
    repositories {
        maven {
            url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1"
        }
    }

    dependencies {
        modRuntimeOnly('me.djtheredstoner:DevAuth-fabric:1.1.0') {
            exclude group: 'net.fabricmc', module: 'fabric-loader'
        }
    }
}

// Root project: shared configuration and the gl41metal native/shader build tasks.
// The actual mod jars are produced by the :fabric and :neoforge subprojects.

plugins {
    id 'com.diffplug.spotless' version '8.8.0'
}

repositories {
    mavenCentral()
}

// All Java sources (main + both loader source sets) live under the root src/, so Spotless is
// configured here rather than in the loader subprojects. Native code (.mm/.h/.metal) is formatted
// separately with clang-format via the .clang-format file (BasedOnStyle: Google).
spotless {
    java {
        target 'src/*/java/**/*.java'
        googleJavaFormat()
    }
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"
def isMacOsHost = System.getProperty("os.name").toLowerCase().contains("mac")

ext.isInGHA = isInGHA
ext.isMacOsHost = isMacOsHost

version = project.mod_version
group = project.maven_group

ext.gitCommitHash = { ->
    try {
        ExecOutput result = providers.exec {
            commandLine = ['git', 'rev-parse', 'HEAD']
            ignoreExitValue = true
        }

        if (result.getResult().get().getExitValue() != 0) {
            return "<UnknownCommit>";
        } else {
            return result.standardOutput.asText.get().strip();
        }
    } catch (Exception e) {
        e.printStackTrace()
        return "<UnknownCommit>";
    }
}

def gl41MetalNativeDir = layout.buildDirectory.dir("gl41metal-native")
def gl41MetalShaderDir = layout.buildDirectory.dir("gl41metal-shaders")

ext.gl41MetalNativeDir = gl41MetalNativeDir
ext.gl41MetalShaderDir = gl41MetalShaderDir

tasks.register('compileGl41MetalNative', Exec) {
    description = 'Compiles the macOS GL41Metal JNI library'
    group = 'build'
    onlyIf { isMacOsHost }

    def outputDir = gl41MetalNativeDir.get().asFile
    def outputLib = new File(outputDir, 'libvoxy_gl41metal.dylib')
    def javaHome = System.getProperty('java.home')
    def nativeSources = fileTree('src/main/native/gl41metal') {
        include '**/*.mm'
    }
    def nativeHeaders = fileTree('src/main/native/gl41metal') {
        include '**/*.h'
    }

    inputs.files(nativeSources)
    inputs.files(nativeHeaders)
    outputs.file(outputLib)

    doFirst {
        outputDir.mkdirs()
        def sources = nativeSources.files.sort { it.path }.collect { it.path }
        commandLine(
                ['clang++',
                 '-std=c++17',
                 '-ObjC++',
                 '-fobjc-arc',
                 '-O3',
                 '-DNDEBUG',
                 '-Wall',
                 '-Wextra',
                 '-Werror',
                 '-Wno-deprecated-declarations',
                 '-dynamiclib',
                 '-I', "${javaHome}/include",
                 '-I', "${javaHome}/include/darwin",
                 '-I', 'src/main/native/gl41metal'] +
                        sources +
                        ['-framework', 'Foundation',
                         '-framework', 'Metal',
                         '-o', outputLib.absolutePath])
    }
}

tasks.register('compileGl41MetalShaders', Exec) {
    description = 'Compiles GL41Metal Metal shaders into a build-time library'
    group = 'build'
    onlyIf { isMacOsHost }

    def outputDir = gl41MetalShaderDir.get().asFile
    def outputLibrary = new File(outputDir, 'voxy_gl41metal.metallib')
    def shaderSources = fileTree('src/main/native/gl41metal/shaders') {
        include '**/*.metal'
    }

    inputs.files(shaderSources)
    outputs.file(outputLibrary)

    doFirst {
        outputDir.mkdirs()
        def sources = shaderSources.files.sort { it.path }.collect { it.path }
        if (sources.isEmpty()) {
            throw new GradleException('No GL41Metal shader sources found')
        }
        commandLine(['xcrun', 'metal', '-std=metal3.0', '-O'] + sources + ['-o', outputLibrary.absolutePath])
    }
}

// Produces the distributable loader jars with optimized macOS native and Metal code.
tasks.register('release') {
    description = 'Builds the release artifacts for Fabric and NeoForge'
    group = 'build'
    dependsOn ':fabric:build', ':neoforge:build'
}

// Convenient default for local renderer validation. Loader-specific runs remain available as
// :fabric:runClient and :neoforge:runClient.
tasks.register('runClient') {
    description = 'Runs the Fabric client from the shared run directory'
    group = 'application'
    dependsOn ':fabric:runClient'
}

// Gradle expands an unqualified task name to matching tasks in every subproject. Keep the bare
// `runClient` convenience command Fabric-only; the explicit `:neoforge:runClient` path is unchanged.
gradle.projectsEvaluated {
    if (gradle.startParameter.taskNames == ['runClient']) {
        def neoForgeRunClient = project(':neoforge').tasks.named('runClient').get()
        neoForgeRunClient.enabled = false
        neoForgeRunClient.setDependsOn([])
    }
}

// Shared JVM system properties for dev runs (render backend selection + gl41metal tunables,
// see Gl41MetalConfig). Consumed by both loader subprojects' run configurations.
ext.voxyRunProperties = {
    def props = [
        'voxy.renderBackend': System.getProperty('voxy.renderBackend', 'auto'),
    ]
    [
        'voxy.validation.durationSeconds'    : '180',
        'voxy.gl41metal.slotCount'            : '3',
        'voxy.gl41metal.waitTimeoutMs'        : '0',
        'voxy.gl41metal.visibleComposite'     : 'true',
        'voxy.gl41metal.residencyMaxSections' : '262144',
        'voxy.gl41metal.geometryCapacityMb'   : '256',
        'voxy.gl41metal.maxNodes'             : '2097152',
        'voxy.gl41metal.maxTraversalQueue'    : '200000',
        'voxy.gl41metal.maxTraversalRequests' : '1024',
        'voxy.gl41metal.maxWorklistItems'     : '400000',
        'voxy.gl41metal.logGeometryBudget'    : 'false',
        'voxy.gl41metal.dumpShaders'          : 'false',
        'voxy.gl41metal.boundVerticalMargin'  : '1',
        'voxy.gl41metal.boundHorizontalMargin': '0',
        'voxy.gl41metal.boundAddDelayFrames'  : '1',
        'voxy.gl41metal.modelBakeBudgetMs'    : '4',
        'voxy.fluidBridgeWalls'               : 'true',
    ].each { key, defaultValue ->
        props[key] = System.getProperty(key, defaultValue)
    }
    return props
}
